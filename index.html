<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanSat 2027 DeTerrA — Yer İstasyonu Simülasyonu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #111827;
      color: #f9fafb;
    }
    h2 { margin: 0 0 12px 0; }
    .bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
    }
    button.secondary { background: #059669; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
      max-width: 1180px;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    canvas {
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <h2>CanSat 2027 DeTerrA — Yer İstasyonu Örnek Arayüz</h2>

  <div class="bar">
    <button id="toggleBtn">Duraklat</button>
    <button id="csvBtn" class="secondary">CSV İndir</button>
    <div class="card">Alınan: <strong id="rxVal">0</strong></div>
    <div class="card">Kayıp: <strong id="lossVal">0</strong> (<span id="lossPct">0.0%</span>)</div>
    <div class="card">Durum: <strong id="stateVal">0 - Bekleme</strong></div>
    <div class="card">Basınç: <strong id="pVal">-</strong> hPa</div>
    <div class="card">Sıcaklık: <strong id="tVal">-</strong> °C</div>
    <div class="card">İvme: <strong id="aVal">-</strong> m/s²</div>
    <div class="card">GPS: <strong id="gpsVal">-</strong></div>
  </div>

  <div class="grid">
    <div class="stack">
      <canvas id="pCanvas" width="560" height="150"></canvas>
      <canvas id="tCanvas" width="560" height="150"></canvas>
      <canvas id="aCanvas" width="560" height="150"></canvas>
    </div>
    <canvas id="gpsCanvas" width="560" height="474"></canvas>
  </div>

  <script>
    const startTime = Date.now();
    let pktNo = 0;
    let lastPktNo = null;
    let receivedCount = 0;
    let lostCount = 0;
    let running = true;

    const stateLabels = {
      0: "0 - Bekleme",
      1: "1 - Serbest Düşüş",
      2: "2 - İniş / Ayrılma",
      3: "3 - Rover Sürüşü"
    };

    const rows = [[
      "team_id", "pkt_no", "time_ms", "state",
      "pressure", "temp", "ax", "ay", "az",
      "lat", "lon", "sats", "received_at_ms"
    ]];

    const pData = [];
    const tData = [];
    const aData = [];
    const gpsTrack = [];

    function checksum(payload) {
      let c = 0;
      for (let i = 0; i < payload.length; i++) c ^= payload.charCodeAt(i);
      return c.toString(16).toUpperCase().padStart(2, "0");
    }

    function nextPacket() {
      const elapsed = Date.now() - startTime;
      const sec = elapsed / 1000;

      let state = 0;
      let pressure = 1007.5 + (Math.random() - 0.5) * 0.2;
      let ax = (Math.random() - 0.5) * 0.4;
      let ay = (Math.random() - 0.5) * 0.4;
      let az = 9.81;

      if (sec >= 3 && sec < 6) {
        state = 1;
        pressure = 1007.5 + (sec - 3) * 1.6 + (Math.random() - 0.5) * 0.3;
        az = 0.2 + Math.random() * 1.3;
      } else if (sec >= 6) {
        state = 3;
        const impact = sec < 6.4 ? 18.0 : 0.0;
        pressure = 1012.3 + (Math.random() - 0.5) * 0.2;
        ax = Math.sin(sec * 1.5) * 1.2 + (Math.random() - 0.5) * 0.4;
        ay = Math.cos(sec * 1.5) * 1.2 + (Math.random() - 0.5) * 0.4;
        az = 9.81 + impact + (Math.random() - 0.5) * 0.8;
      }

      const temp = 24.5 + Math.sin(sec * 0.2) * 0.4 + (Math.random() - 0.5) * 0.1;
      const driveSec = Math.max(0, Math.min(sec - 6, 180));
      const lat = 39.750500 + driveSec * 0.000018 + Math.sin(driveSec * 0.3) * 0.000005;
      const lon = 37.015000 + driveSec * 0.000014 + Math.cos(driveSec * 0.3) * 0.000005;

      pktNo += 1;
      if (Math.random() < 0.06) return null;

      const payload = [
        "DTR", pktNo, elapsed, state,
        pressure.toFixed(2), temp.toFixed(1),
        ax.toFixed(2), ay.toFixed(2), az.toFixed(2),
        lat.toFixed(6), lon.toFixed(6), 8
      ].join(",");

      return `${payload}*${checksum(payload)}`;
    }

    function drawSeries(canvas, data, color, label, unit) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const latest = data.length ? data[data.length - 1].toFixed(2) : "-";
      ctx.fillStyle = "#9ca3af";
      ctx.font = "12px monospace";
      ctx.fillText(`${label}: ${latest} ${unit}`, 12, 18);

      if (data.length < 2) return;
      const slice = data.slice(-100);
      const min = Math.min(...slice);
      const max = Math.max(...slice);
      const span = (max - min) || 1;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      slice.forEach((v, i) => {
        const x = 12 + (i / (slice.length - 1)) * (w - 24);
        const y = h - 14 - ((v - min) / span) * (h - 36);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function drawGpsTrack(canvas, track) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#9ca3af";
      ctx.font = "13px monospace";
      ctx.fillText("GPS Rota Takibi (Enlem / Boylam)", 12, 20);

      if (track.length === 0) return;
      const lats = track.map(t => t.lat);
      const lons = track.map(t => t.lon);
      const minLat = Math.min(...lats) - 0.00001;
      const maxLat = Math.max(...lats) + 0.00001;
      const minLon = Math.min(...lons) - 0.00001;
      const maxLon = Math.max(...lons) + 0.00001;

      const toX = lon => 26 + ((lon - minLon) / ((maxLon - minLon) || 1)) * (w - 52);
      const toY = lat => h - 26 - ((lat - minLat) / ((maxLat - minLat) || 1)) * (h - 56);

      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      track.forEach((pt, i) => {
        const x = toX(pt.lon), y = toY(pt.lat);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      const last = track[track.length - 1];
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(toX(last.lon), toY(last.lat), 6, 0, Math.PI * 2);
      ctx.fill();
    }

    setInterval(() => {
      if (!running) return;
      const line = nextPacket();
      if (!line) return;

      const [payload, cs] = line.split("*");
      if (checksum(payload) !== cs) return;

      const parts = payload.split(",");
      const currentNo = Number(parts[1]);

      if (lastPktNo !== null && currentNo > lastPktNo + 1) {
        lostCount += (currentNo - lastPktNo - 1);
      }
      lastPktNo = currentNo;
      receivedCount += 1;

      const receivedAtMs = Date.now();
      rows.push([...parts, receivedAtMs]);

      const state = Number(parts[3]);
      const p = Number(parts[4]);
      const t = Number(parts[5]);
      const ax = Number(parts[6]), ay = Number(parts[7]), az = Number(parts[8]);
      const lat = Number(parts[9]), lon = Number(parts[10]);
      const mag = Math.hypot(ax, ay, az);

      pData.push(p);
      tData.push(t);
      aData.push(mag);
      gpsTrack.push({ lat, lon });

      const totalExpected = receivedCount + lostCount;
      const lossPct = totalExpected > 0 ? ((lostCount / totalExpected) * 100).toFixed(1) : "0.0";

      document.getElementById("rxVal").textContent = receivedCount;
      document.getElementById("lossVal").textContent = lostCount;
      document.getElementById("lossPct").textContent = `${lossPct}%`;
      document.getElementById("stateVal").textContent = stateLabels[state] || state;
      document.getElementById("pVal").textContent = p.toFixed(2);
      document.getElementById("tVal").textContent = t.toFixed(1);
      document.getElementById("aVal").textContent = mag.toFixed(2);
      document.getElementById("gpsVal").textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

      drawSeries(document.getElementById("pCanvas"), pData, "#38bdf8", "Basınç", "hPa");
      drawSeries(document.getElementById("tCanvas"), tData, "#fb923c", "Sıcaklık", "°C");
      drawSeries(document.getElementById("aCanvas"), aData, "#34d399", "İvme Büyüklüğü", "m/s²");
      drawGpsTrack(document.getElementById("gpsCanvas"), gpsTrack);
    }, 200);

    document.getElementById("toggleBtn").onclick = (e) => {
      running = !running;
      e.target.textContent = running ? "Duraklat" : "Devam Et";
    };

    document.getElementById("csvBtn").onclick = () => {
      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `telemetry_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
